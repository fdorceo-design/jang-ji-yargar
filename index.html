<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ジャンジャガ</title>
<meta name="description" content="じゃんけん連鎖と不可逆陣地を組み合わせた、5×5の2人対戦アブストラクトゲーム。" />
<meta name="theme-color" content="#0b0b0d" />

<link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon_32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/branding/apple_touch_icon_180.png" />
<link rel="manifest" href="manifest.webmanifest" />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://fdorceo-design.github.io/jang-ji-yargar/" />
<meta property="og:title" content="ジャンジャガ (Jang-Ji-Yargar)" />
<meta property="og:description" content="じゃんけん連鎖と不可逆陣地を組み合わせた、5×5の2人対戦アブストラクトゲーム。" />
<meta property="og:image" content="https://fdorceo-design.github.io/jang-ji-yargar/assets/branding/ogp_jang_ji_yargar_1200x630.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="ジャンジャガ (Jang-Ji-Yargar)" />
<meta name="twitter:description" content="じゃんけん連鎖と不可逆陣地を組み合わせた、5×5の2人対戦アブストラクトゲーム。" />
<meta name="twitter:image" content="https://fdorceo-design.github.io/jang-ji-yargar/assets/branding/ogp_jang_ji_yargar_1200x630.jpg" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <h1 class="logo"><img src="assets/branding/logo_jang_ji_yargar_wordmark_01.png" alt="ジャンジャガ" /></h1>

  <div class="turn-bar">
    <div id="turn-avatar" class="turn-avatar"></div>
    <div class="turn-text">
      <div id="turn-text"></div>
      <div id="turn-phase" class="phase"></div>
    </div>
  </div>

  <div class="board-wrap">
    <img class="board-layer" src="assets/board/board_jjy_zzg_5x5_base_01.jpg" alt="" />
    <img class="board-layer" src="assets/board/board_grid_5x5_gold_01.png" alt="" />
    <div id="board-grid" class="board-grid-overlay"></div>
  </div>

  <div id="tray" class="tray"></div>

  <div id="counters-bar" class="counters-bar">
    <div class="counter"><div id="cnt-j-marks" class="counter-value jjy"></div><div class="counter-label">J</div></div>
    <div class="counter"><div id="cnt-j-rock45" class="counter-value jjy"></div><div class="counter-label">45</div></div>
    <div class="counter"><div id="cnt-j-sp90" class="counter-value jjy"></div><div class="counter-label">90</div></div>
    <div class="counter"><div id="cnt-j-sp45" class="counter-value jjy"></div><div class="counter-label">45</div></div>
    <div class="counter"><div id="cnt-turn" class="counter-value normal"></div><div class="counter-label">T</div></div>
    <div class="counter"><div id="cnt-z-sp45" class="counter-value zzg"></div><div class="counter-label">45</div></div>
    <div class="counter"><div id="cnt-z-sp90" class="counter-value zzg"></div><div class="counter-label">90</div></div>
    <div class="counter"><div id="cnt-z-rock45" class="counter-value zzg"></div><div class="counter-label">45</div></div>
    <div class="counter"><div id="cnt-z-marks" class="counter-value zzg"></div><div class="counter-label">Z</div></div>
  </div>

  <div id="rotation-panel" class="rotation-panel hidden"></div>

  <div class="controls">
    <button id="pass-btn" class="hidden">手番を相手に渡す</button>
  </div>

  <div id="log" class="log"></div>
</div>

<div id="win-banner" class="win-banner hidden">
  <div id="win-avatar" class="avatar"></div>
  <h2 id="win-text"></h2>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
